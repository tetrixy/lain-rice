backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Blur (размытие для ощущения глубины и стекла)
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Скругления (минимальные, для аккуратности)
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Тени
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.4;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'"
];

# Прозрачность
opacity-rule = [
  "92:class_g = 'kitty'",
  "100:class_g = 'i3lock-color'",
  "100:class_g = 'Polybar'"
];