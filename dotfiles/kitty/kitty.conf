# Kitty config | Lain Theme
font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

# Цвета
foreground #dcdcdc
background #0a0a0a
selection_background #8b0000
selection_foreground #0a0a0a
cursor #7fd4d4
cursor_text_color #0a0a0a

# Акцентные цвета (красный)
color0 #0a0a0a
color1 #8b0000
color2 #1a1a1a
color3 #dcdcdc
color4 #7fd4d4
color5 #8b0000
color6 #7fd4d4
color7 #dcdcdc

# Прозрачность и отступы
background_opacity 0.92
window_padding_width 12

# Курсор
cursor_shape block
cursor_blink_interval 0.5

# Скроллбар
scrollback_lines 2000