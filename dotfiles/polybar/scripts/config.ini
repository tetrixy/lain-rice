[colors]
background = #0a0a0a
background-alt = #1a1a1a
foreground = #dcdcdc
primary = #8b0000
accent = #8b0000
secondary = #7fd4d4
alert = #8b0000
disabled = #555555

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28pt
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 1pt
border-color = ${colors.primary}

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = "Iosevka Nerd Font:size=10;2"
font-1 = "Iosevka Nerd Font:size=16;4"

modules-left = xworkspaces glitch
modules-center = xwindow
modules-right = pulseaudio battery wlan xkeyboard date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/glitch]
type = custom/script
exec = ~/.config/polybar/scripts/glitch.sh
interval = 5
format = <label>
label = "%output%"
label-font = 2

[module/xwindow]
type = internal/xwindow
label = "%title:0:60:...%"
label-empty = "玲音 // WIRED"

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = "%percentage%%"
label-muted = " muted"
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = "%percentage%%"
label-discharging = "%percentage%%"
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/wlan]
type = internal/network
interface = wlan0
interval = 3.0
format-connected = <ramp-signal> <label-connected>
label-connected = "%essid%"
label-disconnected = "offline"
label-disconnected-foreground = ${colors.disabled}
ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = "%layout%"
label-layout-foreground = ${colors.secondary}
label-indicator-padding = 1
label-indicator-margin = 1
label-indicator-background = ${colors.background-alt}

[module/date]
type = internal/date
interval = 1
date = "%d.%m.%Y"
date-alt = "%Y-%m-%d"
time = "%H:%M"
time-alt = "%H:%M:%S"
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = "%date% %time%"